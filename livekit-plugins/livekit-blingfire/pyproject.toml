[build-system]
# setuptools 83.0.0+ patches GHSA-h35f-9h28-mq5c (sdist MANIFEST.in exclusion bypass)
requires = ["setuptools>=83.0.0", "pybind11"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel.macos]
repair-wheel-command = "" # getting issues with unresolved files

[tool.cibuildwheel]
before-build = "pip install pybind11[global]"
skip = "*-musllinux_*"
test-command = "python {project}/test_import.py"
